plugins { id 'com.android.application' }

android {
    namespace 'com.manureymar.robotpulse'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.manureymar.robotpulse'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.7.0'
    }
    sourceSets { main { assets.srcDirs = ['../../game'] } }
    signingConfigs {
        preview {
            storeFile rootProject.file('preview-signing.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.preview'; versionNameSuffix '-preview'; signingConfig signingConfigs.preview }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
