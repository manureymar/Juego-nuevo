name: Robot Pulse — test and Android APK

on:
  push:
    branches: [main]
    paths: ['game/**', 'android/**', 'scripts/**', 'tests/**', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: robot-pulse-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check assets and deterministic game tests
        run: |
          npm run check
          npm test
      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test the mobile game in Chromium
        run: |
          node tests/mining-browser.mjs
          node tests/dialogs.mjs
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-pulse-browser-checks
          path: test-results/
          retention-days: 30
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable offline APK
        run: |
          test -s android/preview-signing.keystore || { echo 'Existing preview signing key is required'; exit 1; }
          gradle -p android assembleDebug --no-daemon
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and test the actual Android app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          # 37.2.12 terminates qemu-system-x86 with a host core dump during
          # WebView reload (run 38029332033). Pin the official 36.3.10 stable
          # binary; the Android 15 image and complete APK checks stay the same.
          # https://developer.android.com/studio/emulator_archive
          emulator-build: 14472402
          # Android documents disabling Vulkan for Chromium rendering issues in
          # the emulator. Keep the APK and every animation test unchanged.
          # https://developer.android.com/studio/run/emulator-troubleshooting
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: node tests/android.mjs
      - name: Retain emulator diagnostics
        if: always()
        run: |
          mkdir -p test-results/android
          free -m > test-results/android/runner-memory.txt
          sudo dmesg | tail -150 > test-results/android/runner-kernel.txt
          sudo journalctl --no-pager --since '-20 minutes' | grep -Ei 'qemu|emulator|segfault|core dump|oom-kill|killed process' > test-results/android/emulator-journal.txt || true
          sudo journalctl --no-pager --since '-20 minutes' -t systemd-coredump > test-results/android/emulator-crash.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-pulse-native-android-checks
          path: test-results/android/
          retention-days: 30
      - name: Verify APK signature and package
        run: |
          set -o pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee test-results/apk-signature.txt
          grep -q 'Signer #1 certificate SHA-256 digest: 7cd69261b62da3dfd299116a44f25466866f183ff802fa88630ac2dc0b8c5856' test-results/apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk > test-results/apk-info.txt
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/RobotPulse-0.7.0.apk
          cd downloads
          sha256sum RobotPulse-0.7.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RobotPulse-Android-0.7.0
          path: |
            downloads/RobotPulse-0.7.0.apk
            downloads/SHA256SUMS.txt
            test-results/apk-info.txt
            test-results/apk-signature.txt
          retention-days: 90
      - name: Save the tested APK in this repository
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'A newer source revision exists; its run will publish the next APK.'
            exit 0
          fi
          git config user.name 'Robot Pulse build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p docs/polish-v0.7/android
          cp test-results/android/results.json test-results/apk-info.txt test-results/apk-signature.txt docs/polish-v0.7/android/
          cp test-results/android/*.png docs/polish-v0.7/android/
          cp test-results/mining/card-digitizing.png test-results/mining/01-earned-card.png test-results/mining/card-es.png docs/polish-v0.7/review/mining/
          cp test-results/mining/results.json docs/polish-v0.7/review/mining/results.json
          cp test-results/browser-results.json docs/polish-v0.7/review/browser-results.json
          git add downloads/RobotPulse-0.7.0.apk downloads/SHA256SUMS.txt android/preview-signing.keystore docs/polish-v0.7
          git diff --cached --quiet && exit 0
          git commit -m 'build: save tested Android preview APK [skip ci]'
          git push origin HEAD:main
